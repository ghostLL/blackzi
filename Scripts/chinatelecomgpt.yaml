name: 中国电信小组件（保活优化版）
description: 中国电信话费、流量、语音小组件；增加缓存状态、错误记录与保活结果反馈
author: optimized
icon: https://iili.io/nEufFXR.png
compat_arguments:
  ctCapture: 'true'
compat_arguments_schema:
  ctCapture:
    name: 中国电信数据抓取
    description: 用 Safari 打开 https://e.dlife.cn 登录一次，开启后尝试捕获 Cookie
    default_value: 'true'
    options:
      - 'true'
      - 'false'
dns: {}
scriptings:
  - generic:
      name: china-telecom
      script_url: https://raw.githubusercontent.com/ghostLL/blackzi/refs/heads/main/Scripts/CT_Widget_optimized.js
  - http_request:
      name: 中国电信自动捕获
      match: '^https://e\.(?:dlife\.cn|189\.cn)/'
      script_url: https://raw.githubusercontent.com/ghostLL/blackzi/refs/heads/main/Scripts/CT_Widget_optimized.js
  - schedule:
      name: 中国电信定时保活
      cron: '*/30 * * * *'
      timeout: 60
      script_url: https://raw.githubusercontent.com/ghostLL/blackzi/refs/heads/main/Scripts/CT_Widget_optimized.js
mitm:
  hostnames:
    includes:
      - e.dlife.cn
      - e.189.cn
widgets:
  - name: china-telecom
