name: 中国电信小组件
description: 中国电信 话费 语音 流量小组件（定时保活版）
author: iBL3ND (optimized)
icon: https://iili.io/nEufFXR.png
compat_arguments:
  ctCapture: 'true'
compat_arguments_schema:
  ctCapture:
    name: 中国电信数据抓取
    description: 用 Safari 打开 https://e.dlife.cn 登录一次。建议保持开启，便于自动续 Cookie
    default_value: 'true'
    options:
    - 'true'
    - 'false'
dns: {}
scriptings:
# 小组件渲染
- generic:
    name: china-telecom
    script_url: https://raw.githubusercontent.com/ghostLL/blackzi/refs/heads/main/Scripts/CT_Widget.js
# 访问 e.dlife.cn 时自动捕获 / 合并 Cookie
- http_request:
    name: 中国电信自动捕获
    match: '^https://e\.dli[^{{{ctCapture}}}]e\.cn/'
    script_url: https://raw.githubusercontent.com/ghostLL/blackzi/refs/heads/main/Scripts/CT_Widget.js
# 关键保活：每 30 分钟主动拉一次接口续 session（关键）
- schedule:
    name: 中国电信定时保活
    cron: '*/30 * * * *'
    timeout: 60
    script_url: https://raw.githubusercontent.com/ghostLL/blackzi/refs/heads/main/Scripts/CT_Widget.js
mitm:
  hostnames:
    includes:
    - e.dlife.cn
    - e.189.cn
widgets:
- name: china-telecom
