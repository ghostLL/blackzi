name: 中国电信小组件
description: 中国电信 话费 语音 流量小组件（优化版·区分国内/本地）
author: iBL3ND (optimized)
icon: https://iili.io/nEufFXR.png
compat_arguments:
  ctCapture: 'true'
compat_arguments_schema:
  ctCapture:
    name: 中国电信数据抓取
    description: 用这个链接去登录 https://e.dlife.cn（抓到数据后可以关闭）
    default_value: 'true'
    options:
    - 'true'
    - 'false'
dns: {}
scriptings:
- generic:
    name: china-telecom
    # 请将下方 script_url 替换为你托管的 CT_Widget.js 的 raw 地址
    # 例如上传到 GitHub 后使用 raw.githubusercontent.com 链接
    script_url: https://raw.githubusercontent.com/你的用户名/你的仓库/main/CT_Widget.js
- http_request:
    name: 中国电信自动捕获
    match: '^https://e\.dli[^{{{ctCapture}}}]e\.cn/'
    script_url: https://raw.githubusercontent.com/IBL3ND/js/refs/heads/main/ChinaTelecom.js
mitm:
  hostnames:
    includes:
    - e.dlife.cn
widgets:
- name: china-telecom
